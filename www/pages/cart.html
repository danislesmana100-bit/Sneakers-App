<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <style>
      /* ── Cart Item ─────────────────────────────── */
      .cart-item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fff;
        border-radius: 16px;
        border: 1px solid #f0f0f0;
        padding: 14px;
        margin-bottom: 12px;
      }

      .cart-item-img {
        width: 80px;
        height: 80px;
        background: #f7f7f7;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
      }

      .cart-item-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .cart-item-info {
        flex: 1;
        min-width: 0;
      }

      .cart-item-brand {
        font-size: 10px;
        text-transform: uppercase;
        color: #8c8c8c;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .cart-item-name {
        font-size: 14px;
        font-weight: 700;
        color: #1a1a1a;
        margin: 3px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cart-item-meta {
        font-size: 12px;
        color: #8c8c8c;
        margin-bottom: 10px;
      }

      .cart-item-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .cart-item-price {
        font-size: 15px;
        font-weight: 700;
        color: #1a1a1a;
      }

      .qty-control {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f7f7f7;
        border-radius: 10px;
        padding: 6px 10px;
      }

      .qty-btn {
        background: none;
        border: none;
        font-size: 18px;
        font-weight: 700;
        color: #1a1a1a;
        cursor: pointer;
        padding: 0;
        line-height: 1;
        width: 20px;
        text-align: center;
      }

      .qty-value {
        font-size: 14px;
        font-weight: 700;
        min-width: 20px;
        text-align: center;
      }

      .btn-remove {
        background: none;
        border: none;
        cursor: pointer;
        color: #d0d0d0;
        padding: 6px;
        flex-shrink: 0;
        transition: color 0.2s;
        align-self: flex-start;
      }

      .btn-remove:active {
        color: #ff3838;
      }

      .cart-summary {
        background: #fff;
        border-radius: 16px;
        border: 1px solid #f0f0f0;
        padding: 20px;
        margin-top: 8px;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #666;
        margin-bottom: 10px;
      }

      .summary-row.total {
        font-size: 16px;
        font-weight: 700;
        color: #1a1a1a;
        border-top: 1px solid #f0f0f0;
        padding-top: 12px;
        margin-top: 4px;
        margin-bottom: 0;
      }

      .btn-checkout {
        width: 100%;
        background: #1a1a1a;
        color: #fff;
        border: none;
        padding: 16px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 16px;
        transition: all 0.2s ease;
      }

      .btn-checkout:active {
        transform: scale(0.98);
        background: #333;
      }

      #cart-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: #1a1a1a;
        color: #fff;
        padding: 12px 24px;
        border-radius: 50px;
        font-size: 13px;
        font-weight: 600;
        z-index: 9999;
        transition: transform 0.3s ease;
        white-space: nowrap;
        pointer-events: none;
      }

      #cart-toast.show {
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body class="page-body">
    <div class="page-container">
      <h2 class="page-header-title">Keranjang</h2>
      <div id="cart-content">
        <div
          style="
            text-align: center;
            padding: 60px 0;
            color: #aaa;
            font-size: 14px;
          "
        >
          Memuat keranjang...
        </div>
      </div>
    </div>

    <div id="cart-toast"></div>

    <script src="../js/app-core.js"></script>
    <script src="../js/cart-page.js"></script>
  </body>
</html>
