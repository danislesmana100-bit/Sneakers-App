<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <title>SNEAKERS</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <!-- Top Bar Utama / Dinamis -->
    <header class="navbar-global">
      <div class="logo">SNEAKERS<span></span></div>
      <!-- Tombol ini muncul hanya jika user BELUM login -->
      <button
        id="btn-login-top"
        class="btn-top-black"
        onclick="bukaHalamanLogin()"
        style="display: none"
      >
        Masuk
      </button>
    </header>

    <!-- Kontainer Konten (Memuat halaman terpisah) -->
    <div class="app-content-wrapper" id="app-content-box">
      <iframe id="app-frame" src="pages/home.html" frameborder="0"></iframe>
    </div>

    <!-- ── Search Overlay (di parent agar benar-benar full screen) ── -->
    <div id="search-overlay">
      <div class="search-overlay-header">
        <button class="search-back-btn" onclick="tutupSearchOverlay()">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div class="search-overlay-box">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#aaa"
            stroke-width="2.5"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-overlay-input"
            placeholder="Cari sneakers, brand, model..."
            oninput="onSearchOverlayInput(this.value)"
            autocomplete="off"
          />
          <button
            class="search-clear-btn"
            id="search-clear-btn"
            onclick="clearSearch()"
            style="display: none"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#aaa"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="search-overlay-subtitle" id="search-subtitle">
        Ketik untuk mulai mencari...
      </div>
      <div id="search-overlay-results"></div>
    </div>

    <!-- Bottom Navigation Bar Mewah (Disembunyikan secara default) -->
    <nav class="bottom-nav" id="bottom-navigation-bar" style="display: none">
      <div class="nav-item active" onclick="switchPage('home', this)">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="switchPage('cart', this)">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        <span>Keranjang</span>
      </div>
      <div class="nav-item" onclick="switchPage('orders', this)">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Pesanan</span>
      </div>
      <div class="nav-item" onclick="switchPage('profile', this)">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profil</span>
      </div>
    </nav>

    <script src="cordova.js"></script>
    <script src="js/app-core.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
